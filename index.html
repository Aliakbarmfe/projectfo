<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خرید و فروش مجتمع روبیکا</title>
  
  <!-- فونت وزیرمتن برای ظاهر زیبا در موبایل -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">

  <style>
    /* =========================================================
       1. تنظیمات پایه و پس‌زمینه
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      color: #000000; /* تمام متن‌ها مشکی */
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff; /* پس‌زمینه کاملاً سفید */
      /* گرادیان آبی از پایین سمت چپ به بالا سمت راست که کم‌رنگ‌تر می‌شود */
      background-image: radial-gradient(circle at bottom left, rgba(0, 122, 255, 0.45) 0%, rgba(0, 122, 255, 0.15) 35%, rgba(255, 255, 255, 0) 70%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* کانتینر اصلی با ابعاد بهینه برای موبایل */
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 16px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       2. هدر و عنوان اصلی بالا
       ========================================================= */
    .header-banner {
      text-align: center;
      padding: 12px 8px;
      margin-bottom: 20px;
      font-weight: 800;
      font-size: 1.05rem;
      border-bottom: 2px solid rgba(0, 122, 255, 0.2);
    }

    /* =========================================================
       3. استایل دکمه‌ها (کوچک، شیشه‌ای، نیم‌دایره‌ای، انیمیشن کلیک)
       ========================================================= */
    .btn {
      background: rgba(255, 255, 255, 0.25); /* شیشه‌ای هم‌رنگ پس‌زمینه */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid #007aff; /* نوار دکمه آبی */
      border-radius: 50px; /* گوشه‌های نیم‌دایره‌ای / کپسولی */
      padding: 6px 14px; /* اندازه کوچک */
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, opacity 0.3s ease;
      outline: none;
      user-select: none;
    }

    /* انیمیشن کلیک واقعی: کمی به عقب می‌رود و برمی‌گردد */
    .btn:active {
      transform: scale(0.90) translateZ(0);
    }

    /* دکمه‌های پررنگ‌تر (بازگشت و خروج) */
    .btn-bold {
      border: 2px solid #004085; /* آبی پررنگ‌تر */
      background: rgba(0, 122, 255, 0.12);
      font-weight: 700;
    }

    .btn-block {
      width: 100%;
      padding: 8px 16px;
    }

    /* =========================================================
       4. انیمیشن Fade برای صفحات و پاپ‌آپ‌ها
       ========================================================= */
    .fade-element {
      opacity: 0;
      transition: opacity 0.35s ease-in-out;
      pointer-events: none;
    }

    .fade-element.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================================================
       5. صفحات و پاپ‌آپ‌ها
       ========================================================= */
    .page {
      display: none;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .page.visible {
      display: flex;
    }

    /* فرم‌ها و ورودی‌ها */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .input-field {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 122, 255, 0.4);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .input-field:focus {
      border-color: #007aff;
      background: #ffffff;
    }

    /* لیست محصولات */
    .product-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 122, 255, 0.3);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* پاپ‌آپ مودال */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #ffffff;
      border: 1.5px solid #007aff;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* چت روم */
    .chat-box {
      border: 1px solid rgba(0, 122, 255, 0.3);
      border-radius: 16px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.3);
    }

    .chat-bubble {
      max-width: 80%;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .chat-bubble.sent {
      align-self: flex-start;
      background: rgba(0, 122, 255, 0.15);
      border: 1px solid rgba(0, 122, 255, 0.4);
    }

    .chat-bubble.received {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #ccc;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- عنوان بالای صفحه -->
    <div class="header-banner">
      به خرید و فروش مجتمع روبیکا خوش آمدید
    </div>

    <!-- =========================================================
       صفحه ورود / ثبت‌نام
       ========================================================= -->
    <div id="page-auth" class="page visible fade-element active">
      <div class="input-group">
        <label>نام کاربری:</label>
        <input type="text" id="auth-username" class="input-field" placeholder="مثلا: ali123">
      </div>
      <div class="input-group">
        <label>رمز عبور:</label>
        <input type="password" id="auth-password" class="input-field" placeholder="******">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button class="btn btn-block" onclick="login()">ورود</button>
        <button class="btn btn-block" onclick="register()">ثبت‌نام</button>
      </div>
    </div>

    <!-- =========================================================
       صفحه اصلی (محصولات)
       ========================================================= -->
    <div id="page-main" class="page fade-element">
      <div class="nav-bar">
        <span id="user-display" style="font-size: 0.85rem; font-weight: 700;">کاربر: ...</span>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-bold" onclick="openChat()">چت با مدیریت</button>
          <button class="btn btn-bold" onclick="logout()">خروج</button>
        </div>
      </div>

      <button class="btn btn-block" onclick="openModal('modal-add-product')">+ ثبت محصول جدید</button>

      <div id="products-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <!-- لیست محصولات به‌صورت دینامیک بارگذاری می‌شود -->
      </div>
    </div>

    <!-- =========================================================
       صفحه چت
       ========================================================= -->
    <div id="page-chat" class="page fade-element">
      <div class="nav-bar">
        <button class="btn btn-bold" onclick="navigateTo('page-main')">بازگشت</button>
        <span style="font-size: 0.85rem; font-weight: 700;">پشتیبانی و مدیریت</span>
      </div>
      
      <div class="chat-box" id="chat-messages">
        <!-- پیام‌های چت بارگذاری می‌شوند -->
      </div>

      <div style="display: flex; gap: 6px; margin-top: 6px;">
        <input type="text" id="chat-input" class="input-field" style="flex: 1;" placeholder="پیام خود را بنویسید...">
        <button class="btn" onclick="sendMessage()">ارسال</button>
      </div>
    </div>

  </div>

  <!-- =========================================================
     پاپ‌آپ (Modal): افزودن محصول
     ========================================================= -->
  <div id="modal-add-product" class="modal-overlay fade-element" style="display: none;">
    <div class="modal-content">
      <h3 style="font-size: 0.95rem; text-align: center;">ثبت محصول جدید</h3>
      <div class="input-group">
        <label>عنوان محصول:</label>
        <input type="text" id="prod-title" class="input-field">
      </div>
      <div class="input-group">
        <label>قیمت (تومان):</label>
        <input type="number" id="prod-price" class="input-field">
      </div>
      <div class="input-group">
        <label>توضیحات:</label>
        <input type="text" id="prod-desc" class="input-field">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="btn btn-block" onclick="addProduct()">ذخیره</button>
        <button class="btn btn-bold btn-block" onclick="closeModal('modal-add-product')">انصراف / بازگشت</button>
      </div>
    </div>
  </div>

  <!-- =========================================================
     اتصال به فایربیس (Firebase Realtime Database)
     ========================================================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // تنظیمات اختصاصی فایربیس شما
    const firebaseConfig = {
      apiKey: "AIzaSyDaBpj9yKDf8nZynrRYzB6cwrsNXLYNLLg",
      authDomain: "mmdproj-1b37b.firebaseapp.com",
      projectId: "mmdproj-1b37b",
      storageBucket: "mmdproj-1b37b.firebasestorage.app",
      messagingSenderId: "524684192299",
      appId: "1:524684192299:web:2fe8d6c2724944f873986e",
      databaseURL: "https://mmdproj-1b37b-default-rtdb.firebaseio.com"
    };

        // مقداردهی اولیه فایربیس
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;

    // ---------------------------------------------------------
    // سیستم مدیریت صفحات و انیمیشن Fade
    // ---------------------------------------------------------
    window.navigateTo = function(pageId) {
      const activePages = document.querySelectorAll('.page.visible');
      
      activePages.forEach(p => {
        p.classList.remove('active');
        setTimeout(() => {
          p.classList.remove('visible');
          
          const nextPage = document.getElementById(pageId);
          nextPage.classList.add('visible');
          setTimeout(() => nextPage.classList.add('active'), 20);
        }, 300); // زمان هماهنگ با انیمیشن CSS
      });
    };

    // ---------------------------------------------------------
    // سیستم مدیریت پاپ‌آپ‌ها با انیمیشن Fade
    // ---------------------------------------------------------
    window.openModal = function(modalId) {
      const modal = document.getElementById(modalId);
      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('active'), 20);
    };

    window.closeModal = function(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.remove('active');
      setTimeout(() => modal.style.display = 'none', 300);
    };

    // ---------------------------------------------------------
    // اعتبارسنجی و ثبت‌نام / ورود کاربران
    // ---------------------------------------------------------
    window.register = function() {
      const user = document.getElementById('auth-username').value.trim();
      const pass = document.getElementById('auth-password').value.trim();

      if (!user || !pass) return alert('لطفا تمامی فیلدها را پر کنید.');

      set(ref(db, 'users/' + user), { password: pass })
        .then(() => {
          alert('ثبت‌نام با موفقیت انجام شد!');
          login();
        })
        .catch(err => alert('خطا: ' + err.message));
    };

    window.login = function() {
      const user = document.getElementById('auth-username').value.trim();
      const pass = document.getElementById('auth-password').value.trim();

      if (!user || !pass) return alert('لطفا تمامی فیلدها را پر کنید.');

      onValue(ref(db, 'users/' + user), (snapshot) => {
        const data = snapshot.val();
        if (data && data.password === pass) {
          currentUser = user;
          document.getElementById('user-display').innerText = 'کاربر: ' + user;
          navigateTo('page-main');
          loadProducts();
        } else {
          alert('نام کاربری یا رمز عبور اشتباه است.');
        }
      }, { onlyOnce: true });
    };

    window.logout = function() {
      currentUser = null;
      document.getElementById('auth-username').value = '';
      document.getElementById('auth-password').value = '';
      navigateTo('page-auth');
    };

    // ---------------------------------------------------------
    // مدیریت محصولات
    // ---------------------------------------------------------
    window.addProduct = function() {
      const title = document.getElementById('prod-title').value;
      const price = document.getElementById('prod-price').value;
      const desc = document.getElementById('prod-desc').value;

      if (!title || !price) return alert('عنوان و قیمت الزامی است.');

      const newProductRef = push(ref(db, 'products'));
      set(newProductRef, {
        title,
        price,
        desc,
        seller: currentUser
      }).then(() => {
        closeModal('modal-add-product');
        document.getElementById('prod-title').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-desc').value = '';
      });
    };

    function loadProducts() {
      onValue(ref(db, 'products'), (snapshot) => {
        const container = document.getElementById('products-list');
        container.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.values(data).reverse().forEach(prod => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
              <strong style="font-size: 0.9rem;">${prod.title}</strong>
              <span style="font-size: 0.8rem;">قیمت: ${prod.price} تومان</span>
              <p style="font-size: 0.75rem;">${prod.desc || ''}</p>
              <small style="font-size: 0.7rem; color: #555;">فروشنده: ${prod.seller}</small>
            `;
            container.appendChild(card);
          });
        }
      });
    }

    // ---------------------------------------------------------
    // چت اختصاصی کاربر و مدیر
    // ---------------------------------------------------------
    window.openChat = function() {
      navigateTo('page-chat');
      loadMessages();
    };

    window.sendMessage = function() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const chatRef = push(ref(db, `chats/${currentUser}`));
      set(chatRef, {
        sender: currentUser,
        text: text,
        time: Date.now()
      }).then(() => {
        input.value = '';
      });
    };

    function loadMessages() {
      onValue(ref(db, `chats/${currentUser}`), (snapshot) => {
        const chatBox = document.getElementById('chat-messages');
        chatBox.innerHTML = '';
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(msg => {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${msg.sender === currentUser ? 'sent' : 'received'}`;
            bubble.innerText = `${msg.sender}: ${msg.text}`;
            chatBox.appendChild(bubble);
          });
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
    }
  </script>
</body>
</html>
